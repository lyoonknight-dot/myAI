<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kevin | Personal AI</title>


    <style>

        * {
            box-sizing: border-box;
        }


        :root {

            --cobalt:
                #0047AB;

            --cobalt-light:
                #2F6FD6;

            --electric-blue:
                #3D8BFD;

            --deep-navy:
                #020B1C;

            --navy:
                #061A38;

            --panel:
                #0A2347;

            --panel-light:
                #0D2D59;

            --border:
                #174A8F;

            --text:
                #EAF3FF;

            --muted:
                #8FAED8;

            --success:
                #45C47A;

        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:

                radial-gradient(
                    circle at 10% 10%,
                    rgba(
                        0,
                        71,
                        171,
                        0.30
                    ),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    rgba(
                        61,
                        139,
                        253,
                        0.18
                    ),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #010713,
                    var(--deep-navy),
                    #031A38
                );

            color:
                var(--text);

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            overflow:
                hidden;

        }


        /*
        =========================================
        CHAT CONTAINER
        =========================================
        */

        .chat-container {

            position:
                relative;

            width:
                100%;

            max-width:
                760px;

            height:
                90vh;

            display:
                flex;

            flex-direction:
                column;

            border:
                1px solid var(--border);

            border-radius:
                20px;

            overflow:
                hidden;

            background:

                linear-gradient(
                    145deg,
                    rgba(
                        10,
                        35,
                        71,
                        0.97
                    ),
                    rgba(
                        3,
                        18,
                        40,
                        0.98
                    )
                );

            box-shadow:

                0 25px 80px
                rgba(
                    0,
                    0,
                    0,
                    0.65
                ),

                0 0 45px
                rgba(
                    0,
                    71,
                    171,
                    0.18
                );

            backdrop-filter:
                blur(20px);

        }


        /*
        =========================================
        TOP GLOW
        =========================================
        */

        .chat-container::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            left:
                12%;

            right:
                12%;

            height:
                2px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    var(--electric-blue),
                    transparent
                );

            box-shadow:

                0 0 18px
                var(--electric-blue);

            z-index:
                5;

        }


        /*
        =========================================
        HEADER
        =========================================
        */

        .header {

            position:
                relative;

            padding:
                22px;

            text-align:
                center;

            border-bottom:
                1px solid
                rgba(
                    23,
                    74,
                    143,
                    0.8
                );

            background:

                linear-gradient(
                    180deg,
                    rgba(
                        13,
                        45,
                        89,
                        0.85
                    ),
                    rgba(
                        6,
                        26,
                        56,
                        0.65
                    )
                );

        }


        .header h1 {

            margin:
                0;

            color:
                #FFFFFF;

            font-size:
                30px;

            letter-spacing:
                3px;

            text-shadow:

                0 0 20px
                rgba(
                    61,
                    139,
                    253,
                    0.45
                );

        }


        .status {

            margin-top:
                7px;

            color:
                var(--success);

            font-size:
                13px;

            letter-spacing:
                0.5px;

        }


        /*
        =========================================
        CHAT AREA
        =========================================
        */

        #chat {

            flex:
                1;

            overflow-y:
                auto;

            padding:
                25px;

            scroll-behavior:
                smooth;

            background:

                radial-gradient(
                    circle at 50% 0%,
                    rgba(
                        0,
                        71,
                        171,
                        0.07
                    ),
                    transparent 45%
                );

        }


        /*
        =========================================
        SCROLLBAR
        =========================================
        */

        #chat::-webkit-scrollbar {

            width:
                7px;

        }


        #chat::-webkit-scrollbar-track {

            background:
                rgba(
                    2,
                    11,
                    28,
                    0.5
                );

        }


        #chat::-webkit-scrollbar-thumb {

            background:
                var(--cobalt);

            border-radius:
                10px;

        }


        #chat::-webkit-scrollbar-thumb:hover {

            background:
                var(--electric-blue);

        }


        /*
        =========================================
        MESSAGE
        =========================================
        */

        .message {

            margin-bottom:
                18px;

            padding:
                14px 17px;

            border-radius:
                14px;

            max-width:
                80%;

            line-height:
                1.55;

            white-space:
                pre-wrap;

            word-wrap:
                break-word;

            animation:
                messageAppear
                0.25s
                ease;

        }


        @keyframes messageAppear {

            from {

                opacity:
                    0;

                transform:
                    translateY(6px);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);

            }

        }


        /*
        =========================================
        USER MESSAGE
        =========================================
        */

        .user {

            margin-left:
                auto;

            background:

                linear-gradient(
                    135deg,
                    var(--cobalt),
                    var(--cobalt-light)
                );

            color:
                #FFFFFF;

            border:
                1px solid
                var(--electric-blue);

            box-shadow:

                0 8px 25px
                rgba(
                    0,
                    71,
                    171,
                    0.25
                );

        }


        /*
        =========================================
        KEVIN MESSAGE
        =========================================
        */

        .kevin {

            background:

                linear-gradient(
                    145deg,
                    rgba(
                        13,
                        45,
                        89,
                        0.95
                    ),
                    rgba(
                        6,
                        26,
                        56,
                        0.95
                    )
                );

            border:
                1px solid
                var(--border);

            box-shadow:

                0 6px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );

        }


        /*
        =========================================
        MESSAGE LABEL
        =========================================
        */

        .label {

            font-size:
                11px;

            font-weight:
                bold;

            margin-bottom:
                6px;

            opacity:
                0.75;

            letter-spacing:
                1px;

            color:
                #9FC5F5;

        }


        /*
        =========================================
        INPUT AREA
        =========================================
        */

        .input-area {

            display:
                flex;

            padding:
                16px;

            gap:
                10px;

            border-top:
                1px solid
                rgba(
                    23,
                    74,
                    143,
                    0.8
                );

            background:

                linear-gradient(
                    180deg,
                    rgba(
                        6,
                        26,
                        56,
                        0.95
                    ),
                    rgba(
                        2,
                        11,
                        28,
                        0.98
                    )
                );

        }


        /*
        =========================================
        MESSAGE INPUT
        =========================================
        */

        #message-input {

            flex:
                1;

            padding:
                14px 16px;

            border-radius:
                11px;

            border:
                1px solid
                var(--border);

            background:
                rgba(
                    1,
                    10,
                    25,
                    0.9
                );

            color:
                #FFFFFF;

            outline:
                none;

            font-size:
                15px;

            transition:
                border-color
                0.25s ease,

                box-shadow
                0.25s ease;

        }


        #message-input::placeholder {

            color:
                #52729D;

        }


        #message-input:hover {

            border-color:
                var(--cobalt-light);

        }


        #message-input:focus {

            border-color:
                var(--electric-blue);

            box-shadow:

                0 0 0 3px
                rgba(
                    61,
                    139,
                    253,
                    0.12
                ),

                0 0 20px
                rgba(
                    0,
                    71,
                    171,
                    0.20
                );

        }


        /*
        =========================================
        SEND BUTTON
        =========================================
        */

        #send-button {

            padding:
                0 24px;

            border:
                1px solid
                var(--electric-blue);

            border-radius:
                11px;

            background:

                linear-gradient(
                    135deg,
                    var(--cobalt),
                    var(--cobalt-light)
                );

            color:
                #FFFFFF;

            font-weight:
                bold;

            cursor:
                pointer;

            transition:
                transform
                0.2s ease,

                box-shadow
                0.2s ease,

                background
                0.2s ease;

            box-shadow:

                0 7px 22px
                rgba(
                    0,
                    71,
                    171,
                    0.30
                );

        }


        #send-button:hover {

            background:

                linear-gradient(
                    135deg,
                    #075BCF,
                    #4A94FF
                );

            transform:
                translateY(-2px);

            box-shadow:

                0 10px 28px
                rgba(
                    0,
                    71,
                    171,
                    0.45
                );

        }


        #send-button:active {

            transform:
                translateY(0);

        }


        #send-button:disabled {

            opacity:
                0.5;

            cursor:
                not-allowed;

            transform:
                none;

        }


        /*
        =========================================
        MOBILE
        =========================================
        */

        @media (
            max-width: 600px
        ) {

            body {

                align-items:
                    stretch;

            }


            .chat-container {

                height:
                    100vh;

                max-width:
                    none;

                border:
                    none;

                border-radius:
                    0;

            }


            .header {

                padding:
                    18px;

            }


            .header h1 {

                font-size:
                    26px;

            }


            #chat {

                padding:
                    18px;

            }


            .message {

                max-width:
                    88%;

            }


            .input-area {

                padding:
                    12px;

            }


            #send-button {

                padding:
                    0 18px;

            }

        }

    </style>

</head>


<body>


<div class="chat-container">


    <div class="header">

        <h1>
            Kevin
        </h1>

        <div
            class="status"
            id="status"
        >
            Checking connection...
        </div>

    </div>


    <div id="chat">


        <div class="message kevin">

            <div class="label">
                KEVIN
            </div>

            Hello. I'm Kevin, your personal AI assistant. 👋

        </div>


    </div>


    <div class="input-area">


        <input
            type="text"
            id="message-input"
            placeholder="Talk to Kevin..."
            autocomplete="off"
        >


        <button
            id="send-button"
        >
            Send
        </button>


    </div>


</div>


<script>


    const chat =
        document.getElementById(
            "chat"
        );


    const input =
        document.getElementById(
            "message-input"
        );


    const sendButton =
        document.getElementById(
            "send-button"
        );


    const status =
        document.getElementById(
            "status"
        );


    /*
    =========================================
    CHECK KEVIN SERVER
    =========================================
    */

    async function checkKevin() {

        try {

            const response =
                await fetch(
                    "/api/status"
                );


            const data =
                await response.json();


            if (
                data.success
            ) {

                status.textContent =
                    "● Kevin is online";

            } else {

                status.textContent =
                    "Kevin is offline";

            }


        } catch (error) {

            status.textContent =
                "Kevin connection error";


            console.error(
                "Kevin status error:",
                error
            );

        }

    }


    /*
    =========================================
    ADD MESSAGE
    =========================================
    */

    function addMessage(
        text,
        type
    ) {

        const message =
            document.createElement(
                "div"
            );


        message.className =
            `message ${type}`;


        const label =
            document.createElement(
                "div"
            );


        label.className =
            "label";


        label.textContent =
            type === "user"
                ? "YOU"
                : "KEVIN";


        const content =
            document.createElement(
                "div"
            );


        content.textContent =
            text;


        message.appendChild(
            label
        );


        message.appendChild(
            content
        );


        chat.appendChild(
            message
        );


        chat.scrollTop =
            chat.scrollHeight;

    }


    /*
    =========================================
    SEND MESSAGE TO KEVIN
    =========================================
    */

    async function sendMessage() {

        const message =
            input.value.trim();


        if (!message) {

            return;

        }


        /*
        Add user's message.
        */

        addMessage(
            message,
            "user"
        );


        /*
        Clear input.
        */

        input.value =
            "";


        /*
        Prevent multiple requests.
        */

        sendButton.disabled =
            true;


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                message:
                                    message

                            })

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
            ) {

                throw new Error(
                    data.error ||
                    "Kevin could not respond."
                );

            }


            /*
            Display Kevin's
            real AI response.
            */

            addMessage(
                data.message,
                "kevin"
            );


        } catch (error) {

            console.error(
                "Chat error:",
                error
            );


            addMessage(

                "Sorry, I couldn't connect to my AI brain right now.",

                "kevin"

            );


        } finally {

            sendButton.disabled =
                false;


            input.focus();

        }

    }


    /*
    =========================================
    SEND BUTTON
    =========================================
    */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /*
    =========================================
    ENTER KEY
    =========================================
    */

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !sendButton.disabled
            ) {

                sendMessage();

            }

        }
    );


    /*
    =========================================
    START KEVIN
    =========================================
    */

    checkKevin();

    input.focus();


</script>


</body>

</html>
